name: Phase 3B CI

on:
  push:
    branches:
      - phase3b-prep
  pull_request:
    branches:
      - phase3a-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Legacy smoke tests
        run: npm test

      - name: Task migration tests
        run: npm run test:tasks-migration

      - name: Phase 3B preflight tests
        run: npm run test:phase3b-preflight

      - name: Task Supabase repository tests
        run: npm run test:task-supabase-repository

      - name: Task runtime gate tests
        run: npm run test:task-runtime-gate
